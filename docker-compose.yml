version: '3.8'

services:
  node-alpha:
    build: .
    command: ["--listen", "0.0.0.0:7001", "--node-id", "node-alpha"]
    ports:
      - "7001:7001"
    networks:
      - crci-mesh
    restart: on-failure

  node-beta:
    build: .
    command: ["--listen", "0.0.0.0:7002", "--node-id", "node-beta", "--dial", "node-alpha:7001"]
    ports:
      - "7002:7002"
    depends_on:
      - node-alpha
    networks:
      - crci-mesh
    restart: on-failure

  node-byzantine:
    build: .
    # The crci-node CLI currently lacks a --byzantine flag, so we use the byzantine_agent binary directly
    # to inject invalid payloads into node-alpha, proving the raw TCP isolation works across containers.
    entrypoint: ["byzantine_agent"]
    command: ["--target", "node-alpha:7001", "--mode", "flood", "--interval", "100"]
    depends_on:
      - node-alpha
    networks:
      - crci-mesh
    restart: on-failure

networks:
  crci-mesh:
    driver: bridge
