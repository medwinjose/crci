version: '3.8'

services:
  node-alpha:
    build: .
    command: ["--listen", "0.0.0.0:7001", "--node-id", "node-alpha"]
    ports:
      - "7001:7001"
      - "8080:8080"
    networks:
      - crci-mesh
    restart: on-failure

  node-beta:
    build: .
    command: ["--listen", "0.0.0.0:7002", "--node-id", "node-beta", "--dial", "node-alpha:7001"]
    ports:
      - "7002:7002"
    depends_on:
      - node-alpha
    networks:
      - crci-mesh
    restart: on-failure

  node-byzantine:
    build: .
    command: ["--byzantine", "false_allclear", "--to", "node-alpha:7001", "--interval", "500"]
    depends_on:
      - node-alpha
    networks:
      - crci-mesh
    restart: on-failure

  dashboard:
    build:
      context: ./docs/dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_NODE_URL=http://localhost:8080
    networks:
      - crci-mesh
    restart: always

networks:
  crci-mesh:
    driver: bridge
