version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - crci-mesh

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=crci
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - crci-mesh


  honest-node:
    build: .
    environment:
      - NODE_TYPE=honest
      - RUST_LOG=info
    deploy:
      replicas: 30
    networks:
      - crci-mesh
    command: ["/app/target/release/node"]

  byzantine-node:
    build: .
    environment:
      - NODE_TYPE=byzantine
    deploy:
      replicas: 10
    networks:
      - crci-mesh
    command: ["/app/target/release/node"]

networks:
  crci-mesh:
    driver: bridge
