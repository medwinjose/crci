[package]
name = "crci-core"
version = "2.1.0"
edition = "2021"

[features]
# test-utils: exposes internal test helpers (nonce inspection, raw write).
# NOT included in default features — never compiled into production builds.
# Activated automatically during `cargo test --all` via the dev-dependency
# self-reference below.
test-utils = []
paper_v2 = []

[lib]
name = "crci_core"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1.23.2", features = ["v4"] }
async-trait = "0.1.89"
futures = "0.3.32"
log = "0.4.32"
thiserror = "2.0.18"
argon2 = "0.5.3"
bincode = "1"
uniffi = { version = "0.28", features = ["build", "cli"] }
socket2 = "0.5"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
# Self-reference with test-utils feature so integration tests in tests/ can
# access write_raw_for_nonce_test and read_all_nonces_for_test.
crci-core = { path = ".", features = ["test-utils"] }

