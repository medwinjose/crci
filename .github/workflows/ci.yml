name: CI
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Documentation guard
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-docs.sh
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: Real WAN Chaos Test
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y iproute2
          # Network namespaces need root; hand root the runner's Rust toolchain explicitly.
          sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            cargo test --test chaos_wan_real_tests -- --ignored --nocapture
      - name: Build all binaries
        run: cargo build --bins --release

  model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Model-check the TLA+ specifications (configurations under a minute)
        run: python3 docs/tla/check.py --quick
      - name: Committed model exports match the specifications
        run: |
          python3 docs/tla/check.py --export-transitions docs/tla/reputation-transitions.csv
          python3 docs/tla/check.py --export-traces docs/tla/protocol-traces.jsonl
          git diff --exit-code docs/tla/reputation-transitions.csv docs/tla/protocol-traces.jsonl

  cross-compile:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            apt_pkg: gcc-arm-linux-gnueabihf
          - target: aarch64-unknown-linux-gnu
            apt_pkg: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-linker
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crci-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/crci-node
